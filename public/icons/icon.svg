<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb3"/>
      <stop offset="1" stop-color="#1b4965"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#efe4d2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="414" cy="104" r="46" fill="#b5533c"/>
  <!-- trail -->
  <path d="M64 262 C 110 236, 150 222, 196 214" fill="none" stroke="#faf6ee" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24" opacity=".8"/>
  <!-- paper plane -->
  <g transform="translate(262 186) rotate(-22) scale(1.35)">
    <path d="M64 0 L-56 -32 L-20 4 Z" fill="#faf6ee"/>
    <path d="M64 0 L-20 4 L-38 36 Z" fill="#e8dcc6"/>
    <path d="M-20 4 L-38 36 L-26 10 Z" fill="#c9bba2"/>
  </g>
  <!-- waves -->
  <path d="M0 322 C 64 292, 128 292, 192 322 S 320 352, 384 322 S 480 292, 512 306 L512 512 L0 512 Z" fill="url(#sea)"/>
  <path d="M0 392 C 64 362, 128 362, 192 392 S 320 422, 384 392 S 480 362, 512 376 L512 512 L0 512 Z" fill="#2f7fb3" opacity=".9"/>
  <!-- wordmark -->
  <text x="256" y="474" text-anchor="middle" font-family="IBM Plex Sans Thai, Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="92" letter-spacing="2" fill="#faf6ee">gogo</text>
</svg>
